name: Puts tracker

# Forward paper test of weekly vs monthly cash-secured puts ($500k each) on real Cboe EOD quotes,
# for two baskets: 5 watchlist stocks and 5 ETFs.
on:
  schedule:
    - cron: "0 12 * * 2-6"   # 20:00 SGT Tue-Sat: Cboe snapshot of the prior session is settled by then
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puts-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run trackers (stocks basket, ETF basket)
        run: |
          python puts/put_tracker.py stocks puts/data/stocks
          python puts/put_tracker.py etfs puts/data/etfs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puts/data
          if git diff --cached --quiet; then
            echo "No new session; nothing to commit."
            exit 0
          fi
          D=$(tail -1 puts/data/stocks/equity.csv | cut -d, -f1)
          git commit -m "Puts tracker: session $D"
          git push
